name: Morning horoscope

on:
  # Triggered at 09:10 Asia/Taipei by a systemd user timer on the owner's dev machine
  # running `gh workflow run`
  # (post_for_real=true). GitHub's own schedule ran 6+ hours late on
  # 2026-11-07..09, so it is not used. Weekends/holidays are skipped in code.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the card instead of posting"
        type: boolean
        default: true
      post_for_real:
        description: "Post as the real daily card, not [測試中] (external scheduler / catch-up)"
        type: boolean
        default: false
      date:
        description: "Dry run only: build the card for this day (YYYY-MM-DD)"
        type: string
        default: ""
      note:
        description: "Announcement shown under the title (e.g. what a test post changes)"
        type: string
        default: ""
      catch_up:
        description: "Manual catch-up: post for real even past the deadline"
        type: boolean
        default: false

permissions:
  # Writes data/morning_posts.json: same-day dedupe and the watchdog read it.
  contents: write

concurrency:
  group: morning-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post morning horoscope
        env:
          NOTE: ${{ inputs.note }}
          CARD_DATE: ${{ inputs.date }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROUP_MEMBERS: ${{ secrets.GROUP_MEMBERS }}
          MEMBER_ROLES: ${{ secrets.MEMBER_ROLES }}
        run: |
          # The real post is a dispatch with post_for_real (the timer or a
          # manual catch-up). Any other dispatch that posts is
          # marked [測試中]. Real posts are skipped past 10:30: GitHub has
          # started runs 6+ hours late.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m lunch_bot.morning --dry-run --test --note "$NOTE" ${CARD_DATE:+--date "$CARD_DATE"}
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.post_for_real }}" != "true" ]; then
            python -m lunch_bot.morning --test --note "$NOTE"
          elif [ "${{ inputs.catch_up }}" = "true" ]; then
            python -m lunch_bot.morning
          else
            python -m lunch_bot.morning --not-after 10:30
          fi
      - name: Record the morning post
        if: ${{ inputs.post_for_real && !inputs.dry_run }}
        run: |
          git config user.name "lunch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/morning_posts.json ] || exit 0
          git add data/morning_posts.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: 🔧 record morning post $(TZ=Asia/Taipei date +%F)"
          git pull --rebase
          git push
