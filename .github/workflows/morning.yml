name: Morning horoscope

on:
  schedule:
    # 01:00 UTC = 09:00 Asia/Taipei. GitHub may start scheduled runs late.
    # Runs every day: the script itself posts on workdays (incl. 補班) only.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the card instead of posting"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: morning-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post morning horoscope
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROUP_MEMBERS: ${{ secrets.GROUP_MEMBERS }}
        run: |
          # Only the 09:00 schedule is the real post; a manual run that posts
          # is marked [測試中].
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m lunch_bot.morning --dry-run --test
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m lunch_bot.morning --test
          else
            python -m lunch_bot.morning
          fi
