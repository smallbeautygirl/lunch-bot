name: Morning horoscope

on:
  schedule:
    # 01:10 UTC = 09:10 Asia/Taipei: after the 09:00 TWSE open so the card
    # carries intraday numbers, and off the top of the hour, where GitHub
    # delays and sometimes drops scheduled runs.
    # Runs every day: the script itself posts on workdays (incl. 補班) only.
    - cron: "10 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the card instead of posting"
        type: boolean
        default: true
      post_for_real:
        description: "Post as the real daily card, not [測試中] (external scheduler / catch-up)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: morning-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post morning horoscope
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROUP_MEMBERS: ${{ secrets.GROUP_MEMBERS }}
        run: |
          # The real post is the schedule, or a dispatch with post_for_real
          # (external scheduler / catch-up). Any other dispatch that posts is
          # marked [測試中]. Real posts are skipped past 10:30: GitHub has
          # started scheduled runs 6+ hours late.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m lunch_bot.morning --dry-run --test
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.post_for_real }}" != "true" ]; then
            python -m lunch_bot.morning --test
          else
            python -m lunch_bot.morning --not-after 10:30
          fi
