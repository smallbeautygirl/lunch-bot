name: Guess shop allergens

# Asks Claude once per shop what it probably cooks with and commits the
# guesses; the lunch card only reads them. Weekly, to pick up new shops.
on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:
  # A workflow can only be dispatched once it is on main; this starts the
  # first run from the branch that adds it.
  push:
    branches: [feat/allergens]
    paths: [.github/workflows/allergens.yml]

permissions:
  contents: write

jobs:
  guess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Guess for the shops not in the cache
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m lunch_bot.allergens
      - name: Commit the guesses
        run: |
          git config user.name "lunch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shop_allergens.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: 🔧 update shop allergen guesses"
          git pull --rebase
          git push
