name: Lunch bot

on:
  # Triggered at 10:50 Asia/Taipei by a systemd user timer on the owner's dev machine
  # running `gh workflow run`
  # (post_for_real=true). GitHub's own schedule ran 6+ hours late on
  # 2026-11-07..09, so it is not used. Weekends/holidays are skipped in code.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the card instead of posting"
        type: boolean
        default: true
      post_for_real:
        description: "Post as the real daily card, not [測試中] (external scheduler / catch-up)"
        type: boolean
        default: false
      note:
        description: "Announcement shown under the title (e.g. what a test post changes)"
        type: string
        default: ""
      catch_up:
        description: "Manual catch-up: post for real even past the deadline"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lunch-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Last good lunch-map snapshot, used if the site is down. Kept in the
      # Actions cache, not the repo, so the public repo doesn't republish the
      # site's shop data. restore-keys picks the newest earlier snapshot.
      - uses: actions/cache@v4
        with:
          path: data/shops_cache.json
          key: lunch-map-${{ github.run_id }}
          restore-keys: lunch-map-
      - name: Post lunch suggestion
        env:
          NOTE: ${{ inputs.note }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LUNCH_CHIEF_EMAIL: ${{ secrets.LUNCH_CHIEF_EMAIL }}
          LUNCH_CHIEF_NAME: ${{ vars.LUNCH_CHIEF_NAME }}
          GROUP_MEMBERS: ${{ secrets.GROUP_MEMBERS }}
          MEMBER_ROLES: ${{ secrets.MEMBER_ROLES }}
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          # The real post is a dispatch with post_for_real (the timer or a
          # manual catch-up). Any other dispatch that posts is
          # marked [測試中]. Real posts are skipped past 11:45: GitHub has
          # started runs 6+ hours late.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m lunch_bot.main --dry-run --test --note "$NOTE"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.post_for_real }}" != "true" ]; then
            python -m lunch_bot.main --test --note "$NOTE"
          elif [ "${{ inputs.catch_up }}" = "true" ]; then
            python -m lunch_bot.main
          else
            python -m lunch_bot.main --not-after 11:45
          fi
      - name: Save suggestion history
        if: ${{ github.event_name == 'schedule' || (inputs.post_for_real && !inputs.dry_run) }}
        run: |
          git config user.name "lunch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/history.json ] || exit 0
          git add data/history.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: 🔧 record lunch suggestions $(TZ=Asia/Taipei date +%F)"
          git pull --rebase
          git push
